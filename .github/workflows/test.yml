name: 'Run tests'

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      bootjdk-platform:
        required: true
        type: string
      runs-on:
        required: true
        type: string
      xcode-toolset-version:
        required: false
        type: string

env:
  # These are needed to make the MSYS2 bash work properly
  MSYS2_PATH_TYPE: minimal
  CHERE_INVOKING: 1

jobs:
  test:
    name: test
    runs-on: ${{ inputs.runs-on }}
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        test-name:
          - 'jdk/tier1 part 1'
          - 'jdk/tier1 part 2'
          - 'jdk/tier1 part 3'
          - 'langtools/tier1'
          - 'hs/tier1 common'
          - 'hs/tier1 compiler part 1'
          - 'hs/tier1 compiler part 2'
          - 'hs/tier1 compiler part 3'
          - 'hs/tier1 gc'
          - 'hs/tier1 runtime'
          - 'hs/tier1 serviceability'
          - 'lib-test/tier1'
          - 'docs'

        include:
          - test-name: 'jdk/tier1 part 1'
            test-suite: 'test/jdk/:tier1_part1'

          - test-name: 'jdk/tier1 part 2'
            test-suite: 'test/jdk/:tier1_part2'

          - test-name: 'jdk/tier1 part 3'
            test-suite: 'test/jdk/:tier1_part3'

          - test-name: 'langtools/tier1'
            test-suite: 'test/langtools/:tier1'

          - test-name: 'hs/tier1 common'
            test-suite: 'test/hotspot/jtreg/:tier1_common'
            debug-suffix: -debug

          - test-name: 'hs/tier1 compiler part 1'
            test-suite: 'test/hotspot/jtreg/:tier1_compiler_1'
            debug-suffix: -debug

          - test-name: 'hs/tier1 compiler part 2'
            test-suite: 'test/hotspot/jtreg/:tier1_compiler_2'
            debug-suffix: -debug

          - test-name: 'hs/tier1 compiler part 3'
            test-suite: 'test/hotspot/jtreg/:tier1_compiler_3'
            debug-suffix: -debug

          - test-name: 'hs/tier1 gc'
            test-suite: 'test/hotspot/jtreg/:tier1_gc'
            debug-suffix: -debug

          - test-name: 'hs/tier1 runtime'
            test-suite: 'test/hotspot/jtreg/:tier1_runtime'
            debug-suffix: -debug

          - test-name: 'hs/tier1 serviceability'
            test-suite: 'test/hotspot/jtreg/:tier1_serviceability'
            debug-suffix: -debug

          - test-name: 'lib-test/tier1'
            test-suite: 'test/lib-test/:tier1'
            debug-suffix: -debug

          - platform: linux-x64
            test-name: 'docs'
            test-suite: 'test/docs/:tier2'

    steps:
      - name: 'Checkout the JDK source'
        uses: actions/checkout@v4

      - name: Upload JDK bundle
        if: steps.upload-bundles.outputs.bundles-found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: jdk-bundle
          path: bundles/jdk-linux-x64-debug.tar.gz

      - name: Download doc bundle
        if: matrix.test-name == 'docs'
        uses: actions/download-artifact@v4
        with:
          name: docs-bundle
          path: docs_bundle

      - name: Extract doc bundle
        if: matrix.test-name == 'docs'
        run: |
          DOCS_ZIP=$(find docs_bundle -name 'jdk-*-internal_doc-all.zip' | head -n 1)
          if [ -z "$DOCS_ZIP" ]; then
            echo "Could not find doc zip bundle"
            exit 1
          fi

          # Create expected destination (adjust platform if needed)
          mkdir -p build/linux-x64/images/docs
      
          # Unzip into the expected directory
          unzip -q "$DOCS_ZIP" -d build/linux-x64/images/docs
      
          # Set environment variable for the test
          echo "DOCS_JDK_IMAGE_DIR=$(pwd)/build/linux-x64/images/docs" >> $GITHUB_ENV
        

      - name: 'Install dependencies'
        run: |
          # On macOS we need to install some dependencies for testing
          if [[ "$OSTYPE" == "darwin"* ]]; then
            brew install some-dependency
          fi

      - name: Run tests
        run: |
          if [[ "${{ matrix.test-name }}" == "docs" ]]; then
            export DOCS_IMAGE_DIR="$GITHUB_WORKSPACE/build/linux-x64/images/docs"
            echo "DOCS_IMAGE_DIR=$DOCS_IMAGE_DIR"
            ls -R "$DOCS_IMAGE_DIR"  # Debugging
            make test-prebuilt-docs \
              TEST='${{ inputs.test-suite }}' \
              BOOT_JDK=$BOOT_JDK \
              JT_HOME=$JT_HOME \
              DOCS_IMAGE_DIR=$DOCS_IMAGE_DIR \
              JTREG='JAVA_OPTIONS=-XX:-CreateCoredumpOnCrash;VERBOSE=fail,error,time;KEYWORDS=!headful'
          else
            make test-prebuilt \
              TEST='${{ matrix.test-suite }}' \
              BOOT_JDK=${{ steps.bootjdk.outputs.path }} \
              JT_HOME=${{ steps.jtreg.outputs.path }} \
              JDK_IMAGE_DIR=${{ steps.bundles.outputs.jdk-path }} \
              SYMBOLS_IMAGE_DIR=${{ steps.bundles.outputs.symbols-path }} \
              TEST_IMAGE_DIR=${{ steps.bundles.outputs.tests-path }} \
              JTREG='JAVA_OPTIONS=-XX:-CreateCoredumpOnCrash;VERBOSE=fail,error,time;KEYWORDS=!headful'
          fi

          bash ./.github/scripts/gen-test-summary.sh "$GITHUB_STEP_SUMMARY" "$GITHUB_OUTPUT"

        env:
          PATH: ${{ steps.path.outputs.value }}
